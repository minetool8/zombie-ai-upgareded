name: Build Zombie AI Overhaul

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload compiled mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-AI-Overhaul-1.20.1
          path: |
            **/build/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14
